<html>

    <head>

    </head>

    <body>

        <style>

            body{
                background:#000;
            }

            #holder{
                background:#FFF;
                position: relative;
                overflow: hidden;
            }     
            
            .character{
                position:absolute;
                background:#00D;
                border-radius: 10px;
                z-index:5;
            }

            .hollow{
                position: absolute;
                box-shadow:inset 1px 1px 10px 5px rgba(0,0,0,0.5);
                box-sizing: border-box;
                z-index: 10;
            }

            .upper{
                position: absolute;
                background:#000;
                z-index: 20;
            }

            .lightSource{
                position: absolute;
                background: #F00;
                z-index: 30;
            }

        </style>


        <div id="holder">
            
        </div>

        <script>

            var hollowWidth = 60;
            var hollowHeight = 60;
            var hollowDepth = 5;
            var margin = 14;
            var hollowBlocks = [];

            var amountX = 7;
            var amountY = 5;

            var charactersAmount = 10;
            var characterRadius = 7;
            var characters = [];

            var lightSourceHeight = 10;
            var lightSourceIntense = 3;
            var lightSourceRadius = 5;
            var lightSource = null;

            ////

            var fieldWidth = (hollowWidth + margin) * amountX + margin;
            var fieldHeight = (hollowHeight + margin) * amountY + margin;

            var lightSourceX = fieldWidth / 2;
            var lightSourceY = fieldHeight / 2;

            var holderBlock = document.getElementById('holder');

            holderBlock.style.width = fieldWidth + "px";
            holderBlock.style.height = fieldHeight + "px";

            var lightSource = document.createElement("div");
            lightSource.className = "lightSource";
            lightSource.update = function(){
                this.style.width = lightSourceRadius*2+"px";
                this.style.height = lightSourceRadius*2+"px";
                this.style.left = (lightSourceX - lightSourceRadius)+"px";
                this.style.top = (lightSourceY - lightSourceRadius)+"px";
            }

            holderBlock.appendChild(lightSource);

            holderBlock.onclick = function(e){
                console.log(e);
                lightSourceX = e.clientX;
                lightSourceY = e.clientY;
            }

            for(var y = 0; y < amountY; y++){
                for(var x = 0; x < amountX; x++){

                    var hollowBlock = document.createElement("div");
                    hollowBlock.className = "hollow";
                    hollowBlock.x = hollowBlock.style.left = (x*hollowWidth+margin+margin*x);
                    hollowBlock.y = hollowBlock.style.top = (y*hollowHeight+margin+margin*y);
                    hollowBlock.width = hollowBlock.style.width = hollowWidth+"px";
                    hollowBlock.height = hollowBlock.style.height = hollowHeight+"px";

                    hollowBlock.countShadow = function(){

                        var pointLight = { x: lightSourceX, y: lightSourceY, z: lightSourceHeight };
                        var pointHollow = { x: this.x + hollowWidth / 2, y: this.y + hollowHeight / 2 };

                        if(pointLight.x >= this.x 
                            && pointLight.y >= this.y 
                            && pointLight.x <= this.x+hollowWidth
                            && pointLight.y <= this.y+hollowHeight
                        ){
                            this.style.boxShadow = "none";     
                        } else {
                            var angle = Math.atan2(pointHollow.y - pointLight.y, pointHollow.x - pointLight.x);
                            var dist = 10;
                            var shiftRight = dist * Math.cos(angle);
                            var shiftDown = dist * Math.sin(angle);
                            this.style.boxShadow = "inset "+shiftRight.toFixed(2)+"px "+shiftDown.toFixed(2)+"px 15px -5px #000000";
                        }

                    }

                    hollowBlock.countShadow();
                    hollowBlocks.push(hollowBlock);
                    holderBlock.appendChild(hollowBlock);

                }
            }

            ////////////

            for(var y = 0; y < amountY + 1; y++){
                var upperBlock = document.createElement("div");
                upperBlock.className = "upper";
                upperBlock.style.height = margin+"px";
                upperBlock.style.width = fieldWidth+"px";
                upperBlock.style.top = margin*y+hollowHeight*y;
                holderBlock.appendChild(upperBlock);
            } 

            for(var x = 0; x < amountX + 1; x++){
                var upperBlock = document.createElement("div");
                upperBlock.className = "upper";
                upperBlock.style.width = margin+"px";
                upperBlock.style.height = fieldHeight+"px";
                upperBlock.style.left = margin*x+hollowWidth*x;
                holderBlock.appendChild(upperBlock);
            }

            ////////////

            for(var i = 0; i < charactersAmount; i++){
                var characterBlock = document.createElement("div");
                characterBlock.className = "character";
                characterBlock.style.width = (characterRadius*2)+"px";
                characterBlock.style.height = (characterRadius*2)+"px";
                var blocked = false;
                do {
                    var x = characterRadius * 6 + Math.random() * (fieldWidth - characterRadius * 12);
                    var y = characterRadius * 6 + Math.random() * (fieldHeight - characterRadius * 12);
                    blocked = false;
                    characters.forEach(c=>{
                        if(Math.pow(x - c.x, 2) + Math.pow(y-c.y,2) < Math.pow(characterRadius * 4,2)) blocked = true;
                    });
                } while (blocked);
                characterBlock.style.left = (x-characterRadius)+"px";
                characterBlock.style.top = (y-characterRadius)+"px";
                characterBlock.x = x;
                characterBlock.y = y;
                characterBlock.angle = (Math.PI * 2) * Math.random();
                characterBlock.speed = 3;
                characterBlock.recountVelocity = function(){
                    this.velocityX = this.speed * Math.cos(this.angle);
                    this.velocityY = this.speed * Math.sin(this.angle);
                }
                characterBlock.recountVelocity();
                characters.push(characterBlock);
                holderBlock.appendChild(characterBlock);
            }



            window.setInterval(function(){
                characters.forEach(c=>{

                    var newX = c.x + c.velocityX;
                    var newY = c.y + c.velocityY;

                    if(newX - characterRadius < 0 || newX + characterRadius > fieldWidth){
                        c.angle = Math.PI - c.angle;
                        c.recountVelocity();
                    }

                    if(newY - characterRadius < 0 || newY + characterRadius > fieldHeight){
                        c.angle = c.angle*-1;
                        c.recountVelocity();
                    }

                    c.style.left = (newX-characterRadius)+"px";
                    c.style.top = (newY-characterRadius)+"px";

                    c.x = newX;
                    c.y = newY;

                });

                lightSource.update();

                hollowBlocks.forEach(c=>{
                    c.countShadow();
                });

            }, 30);

        </script>

    </body>

</html>
